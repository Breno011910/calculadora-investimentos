<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Investimentos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .resultado-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .saldo {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Calculadora de Investimentos</h1>

            <div class="campo">
                <label for="valor">Valor Investido</label>

                <input
                    type="text"
                    id="valor"
                    inputmode="numeric"
                    placeholder="Ex: R$ XX,XX"
                >
            </div>

            <div class="campo">
                <label for="cdi">CDI (% ao ano)</label>

                <input
                    type="text"
                    id="cdi"
                    inputmode="decimal"
                    placeholder="Ex: 13,90"
                >
            </div>

            <div class="campo">
                <label for="percentualCdi">Percentual do CDI</label>

                <input
                    type="number"
                    id="percentualCdi"
                    step="0.01"
                    placeholder="Ex: 120"
                >
            </div>

            <div class="campo">
                <label for="dias">Dias úteis</label>

                <input
                    type="number"
                    id="dias"
                    placeholder="Ex: 22"
                >
            </div>

            <button onclick="calcular()">Calcular</button>

            <div id="resultado"></div>

        </div>

    </div>

    <script>

        document.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                calcular();
            }

        });


        // Formatação do valor investido
        document.getElementById("valor").addEventListener("input", function () {

            let valor = this.value.replace(/\D/g, "");

            if (valor === "") {
                this.value = "";
                return;
            }

            valor = (parseInt(valor, 10) / 100).toFixed(2);

            valor = valor
                .replace(".", ",")
                .replace(/\B(?=(\d{3})+(?!\d))/g, ".");

            this.value = "R$ " + valor;

        });


        async function calcular() {

            // Remove "R$", pontos e transforma vírgula em ponto
            const valorTexto = document
                .getElementById("valor")
                .value
                .replace("R$", "")
                .replace(/\./g, "")
                .replace(",", ".")
                .trim();

            const valor = valorTexto;

            const cdi = document
                .getElementById("cdi")
                .value
                .replace(",", ".");

            const percentualCdi =
                document.getElementById("percentualCdi").value;

            const dias =
                document.getElementById("dias").value;


            try {

                const resposta = await fetch(
                    `/calcular?valor=${valor}&cdi=${cdi}&percentualCdi=${percentualCdi}&dias=${dias}`
                );


                if (!resposta.ok) {
                    throw new Error("Erro ao calcular.");
                }


                const dados = await resposta.json();


                document.getElementById("resultado").innerHTML = `

                    <div class="resultado-item">
                        <span>Rendimento bruto:</span>
                        <strong>
                            R$ ${dados.rendimentoBruto.toFixed(2).replace(".", ",")}
                        </strong>
                    </div>

                    <div class="resultado-item">
                        <span>IR (${dados.aliquotaIR}%):</span>
                        <strong>
                            R$ ${dados.ir.toFixed(2).replace(".", ",")}
                        </strong>
                    </div>

                    <div class="resultado-item">
                        <span>Rendimento líquido:</span>
                        <strong>
                            R$ ${dados.rendimentoLiquido.toFixed(2).replace(".", ",")}
                        </strong>
                    </div>

                    <div class="resultado-item saldo">
                        <span>Saldo final:</span>
                        <span>
                            R$ ${dados.saldoFinal.toFixed(2).replace(".", ",")}
                        </span>
                    </div>

                `;

            } catch (erro) {

                document.getElementById("resultado").innerHTML =
                    `<p>Erro ao realizar o cálculo.</p>`;

                console.error(erro);

            }

        }

    </script>

</body>

</html>
